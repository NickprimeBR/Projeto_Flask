{% include 'dashboard/cabecalho.html' %}


<div class="container mt-4">
    <h1>Cadastrar Professor</h1>
    <form action="/professor/salvar/" method="POST">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" name="nome" class="form-control" placeholder="Nome completo" required>
        </div>
        <div class="mb-3">
            <label for="disciplina" class="form-label">Disciplina:</label>
            <input type="text" id="disciplina" name="disciplina" class="form-control" placeholder="Ex: Matemática" required>
        </div>
        <button type="submit" class="btn btn-primary">Salvar Professor</button>
        <a href="/professor" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
