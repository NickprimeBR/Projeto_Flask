{% include 'dashboard/cabecalho.html' %}

<div class="container mt-4">
    <h1 class="mb-4">Cadastrar Curso</h1>
    
    <form action="/curso/salvar/" method="POST">
        <div class="mb-3">
            <label for="nome_curso" class="form-label">Nome do Curso:</label>
            <input type="text" id="nome_curso" name="nome_curso" class="form-control" placeholder="Ex: Informática" required>
        </div>

        <div class="mb-3">
            <label for="duracao" class="form-label">Duração (semestres):</label>
            <input type="number" id="duracao" name="duracao" class="form-control" placeholder="Ex: 4" min="1" required>
        </div>

        <button type="submit" class="btn btn-primary">Salvar Curso</button>
        <a href="/curso" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
